<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DM’s NPC Ledger</title>
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1613" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NPC Ledger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#f4efe6;--card:#fffaf0;--ink:#2b2118;--mute:#7a6a58;--line:#d9ccb6;--acc:#8b2e2e;--ok:#2f6b3f;--met:#fbeed0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1613;--card:#262019;--ink:#eadfcc;--mute:#a39580;--line:#40362b;--acc:#d9695f;--ok:#7bc58b;--met:#33291a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1613;--card:#262019;--ink:#eadfcc;--mute:#a39580;--line:#40362b;--acc:#d9695f;--ok:#7bc58b;--met:#33291a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.4}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:2px solid var(--line);padding:12px 16px;z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{margin:0 0 8px;font-size:1.4rem;color:var(--acc);letter-spacing:.5px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search]{flex:1 1 180px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:6px}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.stat{color:var(--mute);font-size:.9rem;margin-left:auto}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;padding:16px;max-width:1400px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card.met{background:var(--met);border-left-color:var(--acc)}
.top{display:flex;gap:10px;align-items:flex-start}
.top input{width:22px;height:22px;margin-top:3px;accent-color:var(--acc);flex:none;cursor:pointer}
.nm{font-weight:bold;font-size:1.1rem}
.sub{color:var(--mute);font-size:.85rem;font-style:italic}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--acc);margin-top:2px}
p{margin:0;font-size:.93rem}
textarea{width:100%;min-height:62px;resize:vertical;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem}
.foot{display:flex;align-items:center;gap:8px}
.st{font-size:.8rem;color:var(--mute)}
.st.ok{color:var(--ok)}
.st.dirty{color:var(--acc)}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px}
</style>
</head>
<body>
<header>
<h1>🎲 DM’s NPC Ledger</h1>
<div class="bar">
<input type="search" id="q" placeholder="Search name, race, role, trait…">
<button data-f="all" class="on">All</button>
<button data-f="met">Met</button>
<button data-f="new">Not met</button>
<button id="saveAll">💾 Save all</button>
<span class="stat" id="stat"></span>
</div>
</header>
<main id="grid"></main>
<script>
const F=["Aldric","Brenna","Cormac","Delia","Edric","Fenna","Garrick","Hilda","Isolde","Jorund","Kestrel","Lorwen","Marek","Nyssa","Orin","Petra","Quill","Rurik","Sabine","Tobias","Ulric","Vessa","Wendel","Xander","Yara","Zephyr","Bram","Cassia","Darrow","Elspeth","Finnian","Gwen","Haldor","Imara","Joss","Kaelen","Liora","Mordecai","Nell","Osric","Perrin","Rowan","Sigrid","Torvin","Una","Varek","Willa","Yorick","Zora","Ansel","Briar","Corwin","Dagny","Emeric"];
const RACE=["Human","Dwarf","Elf","Halfling","Gnome","Half-Orc","Half-Elf","Tiefling","_","Goliath","Tabaxi","Aasimar","Drow"];
const ROLE=["innkeeper","blacksmith","merchant","guard captain","priest","farmer","fisherman","scholar","thief","herbalist","bard","hunter","sailor","minor noble","beggar","scribe","brewer","stablehand","mercenary","healer","cartographer","alchemist","tailor","miner","minstrel","cook","courier","hermit","jeweler","gravedigger"];
const AGE=["young","adult","middle-aged","elderly"];
const LOOK=["Scar across one cheek","Wild silver hair","Missing two fingers","Ink-stained hands","Piercing green eyes","Always wears a faded red scarf","Heavily tattooed forearms","Limps on the left leg","Unusually tall and thin","Round, cheerful face","Smells of pipe smoke","Wears mismatched boots","Braids with tiny bells","Eyes that never meet yours","Fine clothes, badly worn","Weathered, sun-darkened skin"];
const TRAIT=["Friendly","Suspicious","Greedy","Honest","Nervous","Boastful","Curious","Gruff","Cheerful","Secretive","Pious","Sarcastic","Generous","Lazy","Ambitious","Melancholy","Superstitious","Fiercely loyal","Hot-tempered","Gossipy","Cowardly","Wise","Absent-minded","Charming"];
const QUIRK=["Hums while talking","Collects odd trinkets","Fears birds","Speaks in proverbs","Never forgets a face","Owes money to the wrong people","Secretly writes poetry","Loves a good wager","Talks to a pet rat","Knows a rumor about the local noble","Afraid of the dark","Terrible liar","Hides a forbidden holy symbol","Searching for a missing sibling","Pretends to be richer than they are","Nibbles dried fruit constantly"];
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const FN=F.concat(["Alaric","Bryn","Caelum","Dara","Eamon","Faye","Gareth","Hester","Ivor","Jenna","Kieran","Lysa","Merrick","Nadia","Oswin","Phaedra","Quentin","Rhea","Soren","Thessaly","Ulla","Vance","Wynn","Xenia","Yves","Zane","Anwen","Bertram","Calla","Dorian","Esme","Fergus","Greta","Hugo","Ilsa","Jasper","Katla","Leif","Mira","Nolan","Odette","Pip","Quinn","Rhys","Selene","Tamsin","Ulf","Vera","Wulf","Xavia","Yvaine","Zeke","Aveline","Boris","Cora","Dunstan","Elowen","Flint","Gisela","Harken","Ingrid","Jory","Kora","Lucan","Maren","Nissa","Olwyn"]);
const SP=["Thorn","Iron","Black","Stone","Ash","Red","Gold","Holl","Bright","Dusk","Grey","Storm"],SS=["wood","hand","water","bridge","ford","mane","leaf","well","moor","crow"];
const SN=[];SP.forEach(a=>SS.forEach(b=>SN.push(a+b)));
{const s=rng(99);for(let i=SN.length-1;i>0;i--){const j=Math.floor(s()*(i+1));[SN[i],SN[j]]=[SN[j],SN[i]]}}
const NPCS=[];let dbSeen=0,elfSwap=0,conv=0;
for(let i=0;i<120;i++){
 const r=rng(i*7919+13),p=a=>a[Math.floor(r()*a.length)];
 const t1=p(TRAIT);let t2=p(TRAIT);if(t2===t1)t2=TRAIT[(TRAIT.indexOf(t1)+5)%TRAIT.length];
 let race=p(RACE),role=p(ROLE),age=p(AGE);
 if(i%24===7){race="Vampire";age="ageless"}else if(i%20===3)race="Drow";
 else if(race==="_"){if(!dbSeen){dbSeen=1;race="Vampire";age="ageless"}else{const q=RACE.filter(x=>x!=="_"),s=rng(i*31+5);race=q[Math.floor(s()*q.length)]}}
 if(race==="Elf"&&elfSwap<6){elfSwap++;race="Dwarf"}
 if(race==="Tabaxi"||race==="Aasimar"){const k=conv++;race=k<3?"Human":k<6?"Tiefling":"Elf"}
 NPCS.push({id:i,name:FN[i]+" "+SN[i],
  sub:`${age[0].toUpperCase()+age.slice(1)} ${race} ${role}`,look:p(LOOK),pers:`${t1} and ${t2.toLowerCase()}. ${p(QUIRK)}.`});
}
const KEY="dm-npc-ledger-v1";
let saved={},work={},filter="all",query="";
try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){saved={}}
work=JSON.parse(JSON.stringify(saved));
const grid=document.getElementById("grid"),stat=document.getElementById("stat");
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved));return true}catch(e){return false}}
function same(a,b){a=a||{a:false,n:""};b=b||{a:false,n:""};return !!a.a===!!b.a&&(a.n||"")===(b.n||"")}
function setStatus(id){const el=document.getElementById("st"+id);if(!el)return;
 const d=!same(work[id],saved[id]);el.textContent=d?"Unsaved changes":(saved[id]?"Saved ✓":"");el.className="st "+(d?"dirty":"ok")}
function count(){const m=Object.values(work).filter(x=>x.a).length;stat.textContent=`Met: ${m} / ${NPCS.length}`}
function render(){
 const q=query.toLowerCase();
 const list=NPCS.filter(n=>{const w=work[n.id]||{};
  if(filter==="met"&&!w.a)return false;if(filter==="new"&&w.a)return false;
  return !q||(n.name+n.sub+n.look+n.pers+(w.n||"")).toLowerCase().includes(q)});
 grid.innerHTML=list.length?"":'<div class="empty">No NPCs match.</div>';
 list.forEach(n=>{const w=work[n.id]||{a:false,n:""};
  const c=document.createElement("div");c.className="card"+(w.a?" met":"");c.id="c"+n.id;
  c.innerHTML=`<div class="top"><input type="checkbox" ${w.a?"checked":""} title="Mark as met"><div><div class="nm"></div><div class="sub"></div></div></div>
  <div class="lbl">Description</div><p class="d"></p><div class="lbl">Personality</div><p class="p"></p>
  <div class="lbl">Notes</div><textarea placeholder="Short notes…" maxlength="500"></textarea>
  <div class="foot"><button class="sv">Save</button><span class="st" id="st${n.id}"></span></div>`;
  c.querySelector(".nm").textContent=n.name;c.querySelector(".sub").textContent=n.sub;
  c.querySelector(".d").textContent=n.look+".";c.querySelector(".p").textContent=n.pers;
  const ta=c.querySelector("textarea");ta.value=w.n||"";
  c.querySelector("input").onchange=e=>{(work[n.id]=work[n.id]||{a:false,n:""}).a=e.target.checked;c.classList.toggle("met",e.target.checked);setStatus(n.id);count()};
  ta.oninput=()=>{(work[n.id]=work[n.id]||{a:false,n:""}).n=ta.value;setStatus(n.id)};
  c.querySelector(".sv").onclick=()=>{saved[n.id]=JSON.parse(JSON.stringify(work[n.id]||{a:false,n:""}));
   const ok=persist();const el=document.getElementById("st"+n.id);
   if(!ok){el.textContent="Couldn’t save in this browser";el.className="st dirty"}else setStatus(n.id)};
  grid.appendChild(c);setStatus(n.id)});
 count();
}
document.getElementById("q").oninput=e=>{query=e.target.value;render()};
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;
 document.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("on",x===b));render()});
document.getElementById("saveAll").onclick=()=>{saved=JSON.parse(JSON.stringify(work));
 const ok=persist();stat.textContent=ok?"All saved ✓":"Couldn’t save in this browser";
 NPCS.forEach(n=>setStatus(n.id));setTimeout(count,1800)};
render();

// ===== OFFLINE / INSTALLABLE APP =====
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
 window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
